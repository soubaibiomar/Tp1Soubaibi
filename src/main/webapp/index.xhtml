
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <h:outputStylesheet name="css/mycsslayout.css"/>
    <h:outputScript name="js/script.js" target="head"/>
    <title>Conversation Gemini - TP1</title>
</h:head>

<h:body>
    <f:view>

        <!-- Messages d'erreur -->
        <h:messages errorStyle="color: red"
                    showDetail="true"
                    showSummary="false"
                    globalOnly="true"/>

        <h:form id="form">

            <!-- Choix du role systeme -->
            <p:outputLabel for="rolesysteme"
                           value="Rôle de l'API : "/>

            <p:selectOneMenu id="rolesysteme"
                             value="#{bb.roleSysteme}"
                             editable="true"
                             required="true"
                             requiredMessage="Vous devez indiquer le rôle de l'API"
                             disabled="#{!bb.roleSystemeChangeable}">

                <f:selectItems value="#{bb.rolesSysteme}"/>

            </p:selectOneMenu>

            <h:message for="rolesysteme"
                       errorStyle="color: red"/>

            <!-- Commencer une nouvelle conversation -->
            <h:outputText value="  "/>

            <h:commandButton value="Nouveau chat"
                             action="#{bb.nouveauChat}"
                             immediate="true"/>

            <!-- Interface principale -->
            <h:panelGrid id="paneltotal"
                         columns="2"
                         columnClasses="topAligned,topAligned">

                <!-- Colonne gauche -->
                <h:panelGrid id="panelgauche" columns="1">

                    <!-- Question et reponse -->
                    <h:panelGrid id="questionetreponse"
                                 columns="1">

                        <h:panelGroup>
                            <h:outputText value="Question :"/>

                            <button type="button"
                                    onclick="copyToClipboard('question')">
                                Copier question
                            </button>

                            <button type="button"
                                    onclick="toutEffacer()">
                                Effacer question et réponse
                            </button>
                        </h:panelGroup>

                        <h:inputTextarea id="question"
                                         value="#{bb.question}"
                                         title="Question"
                                         cols="50"
                                         rows="5"/>

                        <h:commandButton
                                value="Envoyer la question"
                                action="#{bb.envoyer}"/>

                        <h:panelGroup>
                            <h:outputText value="Réponse :"/>

                            <button type="button"
                                    onclick="copyToClipboard('reponse')">
                                Copier réponse
                            </button>
                        </h:panelGroup>

                        <h:inputTextarea id="reponse"
                                         value="#{bb.reponse}"
                                         title="Réponse"
                                         cols="50"
                                         rows="15"/>

                        <!-- Mode debug :
                             bouton du support TP1 -->
                        <p:outputPanel
                                style="display:flex; align-items: center; gap: 10px">

                            <h:outputText value="Mode debug : "/>

                            <p:toggleSwitch id="debugSwitch"
                                            value="#{bb.debug}"
                                            styleClass="mb-2"
                                            label="Mode debug">

                                <p:ajax event="change"
                                        process="@this"
                                        update="debugZone"/>

                            </p:toggleSwitch>

                            <p:tooltip for="debugSwitch"
                                       value="Active ou non l'affichage du JSON sur les requêtes et réponses du LLM."/>

                        </p:outputPanel>

                    </h:panelGrid>

                    <!-- Panneau debug :
                         deux JSON demandes dans le TP1 -->
                    <h:panelGroup id="debugZone"
                                  layout="block">

                        <h:panelGrid id="debug"
                                     columns="1"
                                     rendered="#{bb.debug}">

                            <h:outputText
                                    value="JSON de la requête envoyée à Gemini :"/>

                            <h:inputTextarea
                                    id="texteRequeteJson"
                                    value="#{bb.texteRequeteJson}"
                                    readonly="true"
                                    cols="50"
                                    rows="15"/>

                            <h:outputText
                                    value="JSON de la réponse reçue de Gemini :"/>

                            <h:inputTextarea
                                    id="texteReponseJson"
                                    value="#{bb.texteReponseJson}"
                                    readonly="true"
                                    cols="50"
                                    rows="15"/>

                        </h:panelGrid>

                    </h:panelGroup>

                </h:panelGrid>

                <!-- Colonne droite :
                     historique de conversation -->
                <h:panelGrid id="paneldroit"
                             columns="1"
                             style="vertical-align: top;">

                    <h:panelGroup>
                        <h:outputText value="Conversation :"/>

                        <button type="button"
                                onclick="copyToClipboard('conversation')">
                            Copier conversation
                        </button>
                    </h:panelGroup>

                    <h:inputTextarea
                            id="conversation"
                            rows="30"
                            cols="50"
                            readonly="true"
                            value="#{bb.conversation}"
                            title="Conversation entière"/>

                </h:panelGrid>

            </h:panelGrid>

        </h:form>

    </f:view>
</h:body>
</html>
